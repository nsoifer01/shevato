name: arena emulator

# Runs BOTH Arena suites that need the real Firebase emulators:
# the security-rules suite (apps/arena/tests-rules/) and the two-client
# multiplayer e2e (apps/arena/e2e/emulator.mjs). Isolated from the push/PR workflows on purpose,
# following cross-browser.yml's pattern: this job needs Java plus a
# firebase-tools/emulator download, and the fast CI stays dependency-free.
#
# THE JOB ALWAYS RUNS; THE SUITES ARE WHAT IS CONDITIONAL.
#
# That distinction is the entire point of the "Scope" step below, and it was
# paid for on 2026-09-08, when PRs #509 and #511 merged with this check RED.
# Nothing was overridden and no gate was bypassed: `rules` was simply not in
# branch protection's required contexts. It could not be, either. A workflow
# filtered by `on.<event>.paths` reports NOTHING on a change that misses the
# filter, and a required check that never reports leaves every unrelated PR
# parked on "Expected - Waiting for status to be reported" with no way out.
# The three contexts that ARE required (test, lint, browser) all run
# unconditionally on every pull request, which is precisely why they could be.
#
# So the filter moved off the trigger and into the job, where a skip still
# produces a green check run. The property the path filter was protecting -
# a documentation edit runs no emulator - is unchanged. It is now reported
# rather than silent, and that is what makes this job requireable.
#
# CHANGE-TRIGGERED (2026-09-05 audit F21). "firestore.rules changes are rare
# and always land with a local pass" was the old justification for weekly-only,
# and it is not a gate: it is a description of a habit. An authorization
# boundary is exactly the thing that must be checked by a machine before it
# lands.
#
# WEEKLY, unchanged: emulator/tooling drift (a firebase-tools or jar release
# changing behaviour) arrives on the tools' schedule, not with our commits, so
# a scheduled run is the only thing that catches it.
#
# ARENA_RULES_REQUIRE=1 turns the suite's local skip-when-unavailable
# behavior into a hard failure here, so a broken Java setup or download can
# never fake a green run.
on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    # Both suites, plus a cold firebase-tools download on a cache miss.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The Scope step diffs a pull request against its merge base and a
          # push against its predecessor. Neither commit exists in the default
          # single-commit checkout.
          fetch-depth: 0

      # Which files can move this job's OUTCOME. Everything else skips the
      # suites and still reports success, so this stays cheap enough to run on
      # every pull request while remaining a real gate on the ones that matter.
      #
      # Fail-safe is RUN, never skip: an unknown event, a missing commit or a
      # failed diff all fall through to the full suites. The worst case of a
      # wrong guess here is ten wasted minutes; the worst case in the other
      # direction is an unchecked authorization boundary reported green.
      - name: Scope - decide whether this change can move the emulator outcome
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail

          run_everything() {
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "Running both suites: $1"
            exit 0
          }

          case "$EVENT" in
            # A pull request is its three-dot diff, the same set GitHub shows
            # in Files changed. Two-dot would count master's own commits as
            # this branch's changes.
            pull_request) BEFORE="$PR_BASE";     AFTER="$PR_HEAD";   RANGE='...' ;;
            # A push to master is linear, so its predecessor is the base.
            push)         BEFORE="$PUSH_BEFORE"; AFTER="$PUSH_AFTER"; RANGE='..' ;;
            *)            run_everything "$EVENT has no diff to scope by" ;;
          esac

          case "$BEFORE" in
            ''|0000000000000000000000000000000000000000)
              run_everything "no comparison point for this $EVENT" ;;
          esac
          git cat-file -e "${BEFORE}^{commit}" 2>/dev/null || run_everything "base $BEFORE is unreachable"
          git cat-file -e "${AFTER}^{commit}"  2>/dev/null || run_everything "head $AFTER is unreachable"

          CHANGED=$(git diff --name-only "${BEFORE}${RANGE}${AFTER}") \
            || run_everything "git diff ${BEFORE}${RANGE}${AFTER} failed"

          # The inputs, and why each one is an input:
          #   firestore.rules        the authorization boundary under test
          #   firebase.json          emulator ports and the ruleset wiring
          #   database.rules.json    the RTDB half of that boundary
          #   apps/arena/**          the app that writes through it, plus both suites
          #   sync-system/**         the layer the app writes through
          #   tests/browser/cdp.mjs  the driver the multiplayer e2e imports
          #   package.json/.nvmrc    the scripts this job runs, and the node it runs them on
          #   this workflow          its own steps
          INPUTS='^(firestore\.rules|firebase\.json|database\.rules\.json|package\.json|\.nvmrc|apps/arena/|sync-system/|tests/browser/cdp\.mjs|\.github/workflows/arena-rules\.yml)'
          # sync-system/tests/** is the one carve-out: those files are node
          # tests and their stubs, already covered by the `test` workflow, and
          # nothing in the app or in either emulator suite loads them. Left in,
          # they cost real time for nothing - PR #511 deleted an unrelated app,
          # touched one app-count line under sync-system/tests/, and ran the
          # whole 10-minute emulator suite on the strength of it.
          NOT_INPUTS='^sync-system/tests/'

          # `|| true` is load-bearing, and its absence took the whole repo down
          # on 2026-09-08. Actions runs this block as `bash -e {0}`, so -e is
          # already on before `set -uo pipefail` adds pipefail on top. grep
          # exits 1 when it matches NOTHING, which is precisely the skip case,
          # so the assignment failed and -e killed the step: every pull request
          # with no emulator inputs got a RED required check and could not
          # merge. Fails closed, on the one path that is supposed to be the
          # cheap one.
          HITS=$(printf '%s\n' "$CHANGED" | grep -Ev "$NOT_INPUTS" | grep -E "$INPUTS" || true)
          if [ -n "$HITS" ]; then
            echo "run=1" >> "$GITHUB_OUTPUT"
            echo "Emulator inputs changed:"
            printf '%s\n' "$HITS" | sed 's/^/  /'
          else
            echo "run=0" >> "$GITHUB_OUTPUT"
            echo "No emulator inputs in this change - reporting success without running the suites."
            echo "Changed files:"
            printf '%s\n' "$CHANGED" | sed 's/^/  /'
          fi

      - name: Use Node.js
        if: steps.scope.outputs.run == '1'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Use Java 21
        if: steps.scope.outputs.run == '1'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # firebase-tools lands in the npx cache, the Firestore emulator jar in
      # ~/.cache/firebase/emulators. The key pins the firebase-tools version
      # (see FIREBASE_TOOLS_VERSION in emulator-harness.mjs); bumping the pin
      # naturally invalidates the cache.
      - name: Cache firebase-tools and the emulator jar
        if: steps.scope.outputs.run == '1'
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm/_npx
            ~/.cache/firebase/emulators
          key: arena-rules-firebase-tools-15.27.0

      - name: Run the rules suite against the emulator
        if: steps.scope.outputs.run == '1'
        env:
          ARENA_RULES_REQUIRE: '1'
        run: npm run test:arena:rules

      # The multiplayer e2e ran in NO workflow until 2026-09-05. At 1,407 lines
      # it is the largest e2e file in the repo, it is the only thing that
      # exercises two clients against real Firestore + Auth + RTDB, and it was
      # executed only when somebody remembered to type the command. It belongs
      # here rather than in browser-tests.yml because it needs exactly what
      # this job already pays for: Java 21, the firebase-tools download and the
      # emulator jar, all cached above. Marginal cost is the suite's own
      # runtime.
      #
      # It brings up its own emulators, two static servers (two origins, so
      # three distinct Firebase users) and its own Chrome, and tears all of
      # them down. ARENA_RULES_REQUIRE is read by the same harness, so the
      # skip-when-Java-is-missing path is a hard failure here too.
      #
      # Chrome comes from the runner image; resolve it rather than assume a
      # name, the same way browser-tests.yml does.
      - name: Resolve browser
        if: steps.scope.outputs.run == '1'
        run: |
          set -e
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME_BIN=$c" >> "$GITHUB_ENV"
              echo "Using $c: $("$c" --version)"
              exit 0
            fi
          done
          echo "No Chrome/Chromium found on the runner image." >&2
          exit 1

      - name: Run the multiplayer e2e against the emulators
        if: steps.scope.outputs.run == '1'
        env:
          ARENA_RULES_REQUIRE: '1'
        run: npm run test:arena:emulator
