name: FPL health probe

# THE PROBE ITSELF RUNS ON NETLIFY (since 2026-10-10): netlify/functions/fpl-health.mjs,
# every six hours (00:41, 06:41, 12:41, 18:41 UTC) and every hour while its
# last result is red, against production through the proxy, with every
# invariant of scripts/lib/probe.mjs. GitHub fires this
# repository's schedules hours late or not at all, so it carries nothing
# time-sensitive. This workflow keeps the incident and the manual diagnostic:
#
#   monitor .......... apps/fpl-planner/scripts/health-monitor.mjs reads
#                      fpl-health-status, judges it by its own clock, and keeps
#                      ONE `[fpl-health]` issue in step with it (opened with an
#                      @mention of the owner, closed on recovery, no duplicate
#                      while the same thing stays wrong). It fails while anything
#                      is wrong, so GitHub emails the run's owner as well.
#                      Started two ways, one writer either way:
#                        - workflow_dispatch mode `monitor`, by the Netlify probe
#                          the moment it fails or may have recovered (needs
#                          FPL_HEALTH_GITHUB_TOKEN in Netlify; immediate), with
#                          `expect_at` naming that probe run, so the monitor
#                          never judges the result from before it;
#                        - the schedule below, the BACKSTOP: independent of
#                          Netlify, so a stopped scheduler or a dead site is
#                          still caught, but late by however late GitHub is.
#   drill-failure /
#   drill-recovery ... the same path on a synthetic status, against its own
#                      `[fpl-health drill]` issue: proves the alert reaches the
#                      owner without breaking production.
#   full (default) ... the whole probe on a runner, straight against FPL
#                      (`--direct`), planning a REAL manager (`--entry`, the
#                      owner's public entry unless the FPL_HEALTH_ENTRY
#                      variable names another): his free transfers against
#                      every hit FPL charged, his chips, squad and value, and
#                      his plan against its own numbers. Also on the schedule
#                      (2026-10-16): Netlify's run checks his squad state every
#                      six hours, but his PLAN costs up to 4.5 s of CPU locally,
#                      about 30 s on Netlify, so it is planned here, where a
#                      failure fails the run and GitHub emails the owner.
#                      Then the PRE-GAMEWEEK READINESS GATE (2026-10-16,
#                      `--sample`): twelve more REAL managers (FPL_HEALTH_SAMPLE
#                      to change it, 0 to skip), drawn afresh each six-hour slot
#                      from the overall league's top, middle and deep ranks
#                      plus random and newest ids, each read and planned with
#                      every check above. One manager exercises one path, and
#                      many of the season's defects lived on paths his state
#                      never took (banked transfers, a Free Hit just played, a
#                      late joiner, a lagging history). Polite: one request at
#                      a time, a second apart, about 60-75 in all, stopped by
#                      the first 403/429. Exit 1 is an APPLICATION failure (a
#                      planner defect), exit 2 UPSTREAM only (FPL unreadable);
#                      both fail the run, since a check that could not run is
#                      never a pass, and the step summary names the class, the
#                      failed checks and the paths covered.
#
# Scheduled workflows run only from the default branch. It commits nothing and
# never triggers a Netlify build.

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full: run the probe here; monitor: reconcile the incident with the Netlify probe; drill-*: rehearse the alert'
        required: false
        type: choice
        default: full
        options: [full, monitor, drill-failure, drill-recovery]
      expect_at:
        description: 'monitor only, set by the Netlify probe: the time of the probe run that dispatched this one; the monitor waits until the status shows it'
        required: false
        type: string
        default: ''

# One reconciliation at a time, never cancelled: a dispatch and the backstop
# landing together must not both open an issue. A run waiting behind another
# re-reads the status itself, so the newest one pending is enough.
concurrency:
  group: fpl-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  monitor:
    if: github.event_name == 'schedule' || inputs.mode == 'monitor' || startsWith(inputs.mode, 'drill-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: apps/fpl-planner/scripts
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Reconcile the incident with the Netlify probe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRILL: ${{ startsWith(inputs.mode, 'drill-') && inputs.mode || '' }}
          FPL_HEALTH_EXPECT_AT: ${{ inputs.expect_at || '' }}
        run: |
          if [ -n "$DRILL" ]; then
            node apps/fpl-planner/scripts/health-monitor.mjs --drill "${DRILL#drill-}"
          else
            node apps/fpl-planner/scripts/health-monitor.mjs
          fi

  probe:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'full' || inputs.mode == ''))
    runs-on: ubuntu-24.04
    # The payload checks and the monitored plan take under a minute; each
    # sampled manager about 5 s of paced requests plus 2-20 s of plan (a
    # Wildcard holder is the slow end). Twelve took 146 s in all locally on
    # 2026-10-17; a runner is slower, so about five minutes, with room.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The engine, the shipped baseline and the probe; not the whole site.
          sparse-checkout: apps/fpl-planner
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # FPL_HEALTH_ENTRY=none probes without a manager, as it does on Netlify
      # (evidence-probe.mjs reads `--entry none` that way); any other value
      # that is not a team id fails the run with a clear error. The exit code
      # is kept as the probe's own, so 1 (application) and 2 (upstream only)
      # stay distinguishable in the run's history as well as its summary.
      - name: Probe the live payload, a real manager's plan and a sample of managers
        env:
          FPL_HEALTH_ENTRY: ${{ vars.FPL_HEALTH_ENTRY || '3855835' }}
          FPL_HEALTH_SAMPLE: ${{ vars.FPL_HEALTH_SAMPLE || '12' }}
        run: |
          node apps/fpl-planner/scripts/evidence-probe.mjs --direct --entry "$FPL_HEALTH_ENTRY" \
            --sample "$FPL_HEALTH_SAMPLE" --summary "$GITHUB_STEP_SUMMARY"
