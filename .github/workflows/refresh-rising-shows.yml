name: Refresh Rising Shows data

# Pulls IMDb's daily TSV dumps, runs the build, optionally enriches with
# TMDB metadata, and publishes the regenerated data if anything changed.
# The big artifacts (data.json, data/show-modal-extras.json) are NOT
# committed: each refresh used to bake a ~100 MB blob pair into git
# history, which bloated the repo past 1.5 GB. They are uploaded to the
# rolling "rising-shows-data" GitHub release instead, and the Netlify
# build downloads them at deploy time (scripts/fetch-data.js). Only the
# small derived files (changelog.json, exports/) are still committed,
# and that commit is what triggers the Netlify deploy.
# See apps/rising-shows/DATA_README.md.

on:
  schedule:
    # Every day at 06:00 UTC, to keep the static site current with IMDb's
    # daily TSV publishing cadence. Incremental TMDB cache hits keep
    # runtimes well under 15 min once the cold-start bootstrap is done.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_tmdb:
        description: 'Skip TMDB enrichment (faster, no posters/overviews)'
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh-rising-shows
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Cold first pass after a TMDB schema change (cast back-fill,
    # per-season tvdbId + overview fetch, providers back-fill) re-fetches
    # tens of thousands of entries and, in practice, needs ~3-4 hours
    # end-to-end. Incremental subsequent runs are typically well under
    # 15 min, so this ceiling only matters on the cold pass after a
    # schema bump.
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # The previous dataset is the diff baseline for change detection and
      # the changelog entry. It lives on the rolling release, not in git.
      # A missing asset (first run after the migration, manual deletion) is
      # non-fatal: everything then counts as changed, but build-changelog
      # skips the entry rather than record the whole catalogue as "added"
      # (an initial full-catalogue entry is only written when the changelog
      # itself is empty).
      - name: Download previous release data
        run: |
          mkdir -p /tmp/rs-prev
          for f in data.json show-modal-extras.json; do
            # Retry a transient release/CDN hiccup rather than losing the
            # baseline over it: without data.json here the changelog step has
            # nothing to diff and that day's "What's new" is never recorded
            # (build-changelog.js only writes a full-catalogue entry when the
            # changelog itself is empty), and the change gate below has to
            # fail open and upload regardless.
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                -o "/tmp/rs-prev/$f.gz" \
                "https://github.com/${{ github.repository }}/releases/download/rising-shows-data/$f.gz"; then
              gunzip "/tmp/rs-prev/$f.gz"
            else
              echo "::warning::previous $f.gz not found on the rising-shows-data release; today's changelog entry will be skipped and the change gate will assume the data changed"
            fi
          done
          ls -lh /tmp/rs-prev

      - name: Download IMDb datasets
        working-directory: apps/rising-shows/data
        run: |
          curl -fsSL -o title.basics.tsv.gz https://datasets.imdbws.com/title.basics.tsv.gz
          curl -fsSL -o title.episode.tsv.gz https://datasets.imdbws.com/title.episode.tsv.gz
          curl -fsSL -o title.ratings.tsv.gz https://datasets.imdbws.com/title.ratings.tsv.gz
          ls -lh

      # Restore the TMDB cache from the most recent successful run so we
      # only fetch newly-discovered series, not the whole catalogue.
      - name: Restore TMDB cache
        uses: actions/cache/restore@v5
        with:
          path: apps/rising-shows/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-cache-

      - name: Initial build
        run: node --max-old-space-size=4096 apps/rising-shows/scripts/build-data.js

      - name: Enrich with TMDB
        if: ${{ inputs.skip_tmdb != true }}
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::warning::TMDB_TOKEN secret not configured, skipping enrichment."
            exit 0
          fi
          # Step 1: posters / overviews / original language.
          node apps/rising-shows/scripts/enrich-tmdb.js
          # Step 2: US watch providers (separate call per series; incremental).
          node apps/rising-shows/scripts/enrich-providers.js
          # Merge both into data.json.
          node --max-old-space-size=4096 apps/rising-shows/scripts/build-data.js

      # Persist the cache for the next run regardless of whether the
      # enrichment step ran (we still want to keep what we had).
      - name: Save TMDB cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: apps/rising-shows/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}

      # THE change gate. Everything downstream that costs something (the ~40 MB
      # release upload, the bot PR that triggers the Netlify deploy) hangs off
      # this one step.
      #
      # What it replaces: three separate `cmp -s` / `git diff --quiet`
      # "unchanged" branches that were all dead code. build-data.js stamps a
      # fresh `builtAt` on every run, so data.json never compared equal, and
      # exports/README.md embeds builtAt too, so `git diff --quiet exports/`
      # was never quiet. Measured locally on the real 66,380-season dataset:
      # two consecutive builds of the SAME IMDb dumps produced different
      # data.json bytes and identical content.
      #
      # What makes it real: build-data.js now also stamps `contentHash`, a
      # sha256 (16 hex chars) over everything in data.json EXCEPT builtAt and
      # the hash itself. On that same two-build experiment both runs hashed to
      # 08eeaec95bea8e6d.
      #
      # show-modal-extras.json is compared byte for byte and is part of the
      # decision on purpose: it carries no timestamp (so the compare is honest)
      # and cast strips plus per-episode titles / runtimes / IMDb ids live ONLY
      # in that file, so a TMDB pass can change it while data.json is
      # bit-identical. Gating on data.json alone would ship a stale monolith.
      #
      # Fail-open everywhere: no baseline, an unreadable baseline, or a
      # data.json without a contentHash all count as CHANGED. The worst case is
      # exactly today's behaviour (upload + PR); a real refresh is never
      # skipped because the gate was unsure.
      - name: Detect content change
        id: change
        run: |
          set -e
          hash_of() {
            [ -f "$1" ] || { printf ''; return; }
            node --max-old-space-size=4096 -e '
              const fs = require("fs");
              try {
                const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write(String(d.contentHash || ""));
              } catch (e) { process.stdout.write(""); }
            ' "$1"
          }
          NEW=$(hash_of apps/rising-shows/data.json)
          PREV=$(hash_of /tmp/rs-prev/data.json)
          BASELINE=false
          [ -f /tmp/rs-prev/data.json ] && BASELINE=true

          if [ -z "$NEW" ]; then
            echo "::warning::data.json carries no contentHash; assuming the data changed."
            CHANGED=true
          elif [ -z "$PREV" ]; then
            echo "No baseline contentHash (missing or pre-contentHash asset); assuming the data changed."
            CHANGED=true
          elif [ "$NEW" != "$PREV" ]; then
            CHANGED=true
          elif ! cmp -s apps/rising-shows/data/show-modal-extras.json /tmp/rs-prev/show-modal-extras.json; then
            echo "data.json content is unchanged but show-modal-extras.json differs."
            CHANGED=true
          else
            CHANGED=false
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "contentHash new=${NEW:-none} prev=${PREV:-none} baseline=$BASELINE changed=$CHANGED"

      - name: Build changelog entry
        # Diffs the new data.json against the previous release version and
        # appends a summary to apps/rising-shows/changelog.json. Powers the
        # "What's new" popover in the footer. Skipped when the content is
        # unchanged: there is nothing to record.
        if: steps.change.outputs.changed == 'true'
        run: |
          if [ "${{ steps.change.outputs.baseline }}" != "true" ]; then
            echo "::warning::no baseline data.json, so today's changelog entry cannot be built; the What's new chip will keep showing the previous entry"
            exit 0
          fi
          node apps/rising-shows/scripts/build-changelog.js --prev /tmp/rs-prev/data.json

      - name: Regenerate integration exports
        # Kometa/MDBList artifacts under exports/ (shape collections, Show
        # Finder preset collections, season overlays, ID lists) are derived
        # from data.json and committed so NAS-side Kometa can pull them from
        # raw GitHub URLs. Rebuild them whenever the data refreshes.
        run: node apps/rising-shows/scripts/export-integrations.js

      # Gate on THIS app's own suites, not the whole repo.
      #
      # This step used to run `npm test`, so a failing test in any of the
      # other seven apps blocked the data refresh. That is exactly what
      # happened on 2026-08-23 and again on 08-28 through 08-31: an
      # fpl-planner test failed, this step stopped the job before the release
      # upload, and the live site served 2026-08-27 data until 09-01 with
      # nothing on the page saying so (the staleness badge only fires at 30
      # days). Four days of silence for a reason that had nothing to do with
      # Rising Shows.
      #
      # What this step actually protects is the artifacts THIS job commits:
      # the changelog, the Kometa/MDBList exports and the split index, all
      # covered by the Rising Shows suite, plus the site-wide static
      # invariants (sitemaps, internal links) that the generated pages feed.
      # The rest of the estate is gated on every PR and on every push to
      # master, which is where it belongs.
      - name: Run tests
        run: npm run test:rising-shows && npm run test:static

      # Check the DATA this run produced, not just the code that produced it.
      #
      # Every test above builds its own small fixture, which is the right way
      # to test build logic and leaves the 66,000-record file that actually
      # ships validated by nothing. Nothing downstream covers it either: the
      # bot PR's `tests` and `browser tests` runs never execute (GitHub does
      # not start workflow runs from GITHUB_TOKEN events, see the note on the
      # merge step below), and even when they did they would skip every
      # data-dependent check, because the dataset is gitignored and absent on
      # a runner. This job is the only place the real data exists, so it is
      # the only place it can be checked.
      #
      # Deliberately gating the UPLOAD, not the whole job: a dataset that
      # fails here must not replace the release asset, and the previous one
      # staying live is the safe outcome. The step needs the larger heap for
      # the same reason split-data does: the file is ~80 MB of JSON.
      - name: Validate the refreshed dataset
        if: steps.change.outputs.changed == 'true'
        run: node --max-old-space-size=4096 apps/rising-shows/scripts/validate-dataset.js

      # data.json and show-modal-extras.json live on the rolling
      # "rising-shows-data" release, not in git (the pair is ~150 MB per
      # refresh and was bloating the repo). show-modal-extras.json carries
      # cast strips, per-season overviews, and per-episode titles / runtimes
      # / IMDb ids for the modal, and it must be published alongside data.json
      # or new shows ship with no cast or episode titles on the live site.
      - name: Upload data to the rising-shows-data release
        # Gated on the content hash (see "Detect content change"). The old
        # in-step `cmp -s` guard is gone: builtAt made it unreachable, so this
        # step pushed ~40 MB to the release every single day.
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/rs-new
          gzip -9 -c apps/rising-shows/data.json > /tmp/rs-new/data.json.gz
          gzip -9 -c apps/rising-shows/data/show-modal-extras.json > /tmp/rs-new/show-modal-extras.json.gz
          gh release upload rising-shows-data \
            /tmp/rs-new/data.json.gz \
            /tmp/rs-new/show-modal-extras.json.gz \
            --clobber

      # master is protected by a "PR before Merge" ruleset, so direct pushes
      # are rejected. We push to a short-lived branch, open a PR, and merge
      # it immediately: the ruleset requires 0 approvals and no status
      # checks, and tests already ran above on this exact tree.
      #
      # Only the small derived files are committed now. Whenever the content
      # changed, changelog.json changes too (the new entry carries the new
      # builtAt) and exports/README.md changes at minimum through its own
      # builtAt line, so this merge still fires on every real refresh and
      # remains the Netlify deploy trigger: the deploy's build:site step
      # downloads the assets uploaded above. That holds even when the baseline
      # download failed and the changelog step was skipped, because the exports
      # regeneration above still moves exports/README.md.
      #
      # The `git diff --quiet` check below is no longer the gate (builtAt in
      # exports/README.md meant it was never quiet); it stays as a cheap
      # belt-and-braces guard against opening an empty PR.
      #
      # NOTE ON CI FOR THIS PR, and why the checking happens above instead.
      #
      # This push and merge use GITHUB_TOKEN, and GitHub deliberately does not
      # start workflow runs from GITHUB_TOKEN-driven events. So no run ever
      # executes against a bot/refresh-* branch, and browser-tests.yml's "push
      # to master" trigger does not fire for the bot merge either (verified:
      # 2026-08-22 merge 987e590 and 2026-08-21 merge 5c45851 have no
      # push-event run; every push run on master belongs to a human commit).
      # How that PRESENTS changed on 2026-09-01: the queued runs used to sit at
      # action_required, and now they complete as `failure` with zero jobs and
      # the banner "This run likely failed because of a workflow file issue".
      # There is no workflow file issue. It is the same token restriction
      # rendered differently (the run object exists, event=pull_request,
      # head_branch=bot/refresh-*, conclusion=action_required, zero jobs), and
      # it leaves two red marks on the repo every morning.
      #
      # It cannot be filtered away from inside the workflows either, and the
      # near-miss is worth recording so nobody spends the afternoon on it:
      # `on.pull_request.branches-ignore` matches the PR's BASE branch, which
      # is master here, not its head. Excluding `bot/**` there looks right,
      # reads right in review, and does nothing.
      #
      # So the checking is done ABOVE, in this job, where it can actually run:
      # the app's own suites, the site-wide static invariants, and
      # validate-dataset.js against the real 66,000-record file, which is the
      # one check nothing else in the repo can perform (the dataset is
      # gitignored, so a runner never has it).
      #
      # A fine-grained PAT would additionally make the bot PR run the standard
      # workflows, and remains an owner action outside this repo: create one on
      # nsoifer01/shevato with Contents: write and Pull requests: write, save it
      # as an Actions secret, and swap GH_TOKEN and the `git push` credential
      # here over to it. Worth knowing before doing it: those runs would STILL
      # skip every data-dependent rising-shows check, because the runner has no
      # dataset. They would add coverage of the rest of the estate against the
      # bot's commit, not coverage of the data.
      - name: Open and merge PR if derived files changed
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git diff --quiet \
              apps/rising-shows/changelog.json \
              apps/rising-shows/exports/; then
            echo "No derived-file changes; nothing to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/refresh-rising-shows-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "shevato-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            apps/rising-shows/changelog.json \
            apps/rising-shows/exports/
          git commit -m "chore(rising-shows): refresh data $DATE"
          git push --set-upstream origin "$BRANCH"
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(rising-shows): refresh data $DATE" \
            --body "Automated refresh of IMDb + TMDB data. Data assets updated on the rising-shows-data release."
          gh pr merge "$BRANCH" --merge --delete-branch
