name: Refresh Rising Shows data

# Pulls IMDb's daily TSV dumps, runs the build, optionally enriches with
# TMDB metadata, and publishes the regenerated data if anything changed.
# The big artifacts (data.json, data/show-modal-extras.json) are NOT
# committed: each refresh used to bake a ~100 MB blob pair into git
# history, which bloated the repo past 1.5 GB. They are uploaded to the
# rolling "rising-shows-data" GitHub release instead, and the Netlify
# build downloads them at deploy time (scripts/fetch-data.js). Only the
# small derived files (changelog.json, exports/) are still committed,
# and that commit is what triggers the Netlify deploy.
# See apps/rising-shows/DATA_README.md.

on:
  schedule:
    # Every day at 06:00 UTC, to keep the static site current with IMDb's
    # daily TSV publishing cadence. Incremental TMDB cache hits keep
    # runtimes well under 15 min once the cold-start bootstrap is done.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      skip_tmdb:
        description: 'Skip TMDB enrichment (faster, no posters/overviews)'
        required: false
        type: boolean
        default: false

concurrency:
  group: refresh-rising-shows
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Release the maintainer-approval hold GitHub places on the workflow runs of
  # a bot-authored pull request. Without it the four required checks sit at
  # `action_required` forever and nothing can merge. Narrow on purpose: this
  # job approves runs for the one commit it just pushed, and nothing else.
  # scripts/bot-pr-autopilot.mjs carries the measurement that proves it.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Cold first pass after a TMDB schema change (cast back-fill,
    # per-season tvdbId + overview fetch, providers back-fill) re-fetches
    # tens of thousands of entries and, in practice, needs ~3-4 hours
    # end-to-end. Incremental subsequent runs are typically well under
    # 15 min, so this ceiling only matters on the cold pass after a
    # schema bump.
    #
    # 360 rather than 240 because the job now waits for its own pull request
    # as well as building: up to 45 minutes reconciling a stuck predecessor
    # (rare) plus a 75-minute watch on the new one. On a cold pass the old
    # ceiling would have been reached by the build alone and the watch would
    # have been cut off mid-flight, leaving a pull request with auto-merge
    # armed and a red job saying nothing useful about why.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # GITHUB_TOKEN, and no personal access token anywhere in this
          # workflow. The comment that used to sit here said a PAT was
          # unavoidable because "GitHub does not start workflow runs from
          # GITHUB_TOKEN-driven events". That is the documented rule for most
          # GITHUB_TOKEN events and it is not what happens here: the runs are
          # created against the bot branch and then HELD for maintainer
          # approval, which this job releases itself. Measured, with run ids,
          # in scripts/bot-pr-autopilot.mjs.
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # .nvmrc, not a literal: this workflow spent the whole Node 20
          # end-of-life window pinned to a version the rest of the estate had
          # already left, and nothing said so.
          node-version-file: '.nvmrc'

      # AT MOST ONE OPEN REFRESH PULL REQUEST, EVER.
      #
      # Two of them cannot both merge: they both rewrite changelog.json and the
      # exports, so the second is guaranteed a conflict, and yesterday's stuck
      # branch is how a queue of unmergeable duplicates starts. It is also how
      # a changelog entry gets lost, because tomorrow's build appends to
      # master's changelog.json and diffs against the RELEASE baseline that
      # yesterday already advanced.
      #
      # So before this run spends an hour on IMDb and TMDB, it finishes the
      # last one: releases the approval hold on its checks, arms auto-merge and
      # waits. If that pull request cannot merge (a red check, a conflict), the
      # step fails HERE, cheaply, before anything is uploaded or committed, and
      # says which pull request to look at. Nothing is left half done.
      #
      # On an ordinary day this is one API call and no wait.
      - name: Finish any refresh pull request still open
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/bot-pr-autopilot.mjs reconcile --timeout-min 45

      # Whatever the reconcile merged is now the tip, and this checkout is
      # behind it. Pick it up before building, so the changelog this run
      # appends to is the one that includes yesterday's entry.
      - name: Re-sync to master
        run: |
          set -e
          git fetch --quiet origin master
          git reset --hard --quiet origin/master
          git log --oneline -1

      # The previous dataset is the diff baseline for change detection and
      # the changelog entry. It lives on the rolling release, not in git.
      # A missing asset (first run after the migration, manual deletion) is
      # non-fatal: everything then counts as changed, but build-changelog
      # skips the entry rather than record the whole catalogue as "added"
      # (an initial full-catalogue entry is only written when the changelog
      # itself is empty).
      - name: Download previous release data
        run: |
          mkdir -p /tmp/rs-prev
          for f in data.json show-modal-extras.json; do
            # Retry a transient release/CDN hiccup rather than losing the
            # baseline over it: without data.json here the changelog step has
            # nothing to diff and that day's "What's new" is never recorded
            # (build-changelog.js only writes a full-catalogue entry when the
            # changelog itself is empty), and the change gate below has to
            # fail open and upload regardless.
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                -o "/tmp/rs-prev/$f.gz" \
                "https://github.com/${{ github.repository }}/releases/download/rising-shows-data/$f.gz"; then
              gunzip "/tmp/rs-prev/$f.gz"
            else
              echo "::warning::previous $f.gz not found on the rising-shows-data release; today's changelog entry will be skipped and the change gate will assume the data changed"
            fi
          done
          ls -lh /tmp/rs-prev

      - name: Download IMDb datasets
        working-directory: apps/rising-shows/data
        run: |
          curl -fsSL -o title.basics.tsv.gz https://datasets.imdbws.com/title.basics.tsv.gz
          curl -fsSL -o title.episode.tsv.gz https://datasets.imdbws.com/title.episode.tsv.gz
          curl -fsSL -o title.ratings.tsv.gz https://datasets.imdbws.com/title.ratings.tsv.gz
          ls -lh

      # Restore the TMDB cache from the most recent successful run so we
      # only fetch newly-discovered series, not the whole catalogue.
      - name: Restore TMDB cache
        uses: actions/cache/restore@v5
        with:
          path: apps/rising-shows/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-cache-

      - name: Initial build
        run: node --max-old-space-size=4096 apps/rising-shows/scripts/build-data.js

      - name: Enrich with TMDB
        if: ${{ inputs.skip_tmdb != true }}
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::warning::TMDB_TOKEN secret not configured, skipping enrichment."
            exit 0
          fi
          # Step 1: posters / overviews / original language.
          node apps/rising-shows/scripts/enrich-tmdb.js
          # Step 2: US watch providers (separate call per series; incremental).
          node apps/rising-shows/scripts/enrich-providers.js
          # Merge both into data.json.
          node --max-old-space-size=4096 apps/rising-shows/scripts/build-data.js

      # Persist the cache for the next run regardless of whether the
      # enrichment step ran (we still want to keep what we had).
      - name: Save TMDB cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: apps/rising-shows/data/tmdb-cache.json
          key: tmdb-cache-${{ github.run_id }}

      # THE change gate. Everything downstream that costs something (the ~40 MB
      # release upload, the bot PR that triggers the Netlify deploy) hangs off
      # this one step.
      #
      # What it replaces: three separate `cmp -s` / `git diff --quiet`
      # "unchanged" branches that were all dead code. build-data.js stamps a
      # fresh `builtAt` on every run, so data.json never compared equal, and
      # exports/README.md embeds builtAt too, so `git diff --quiet exports/`
      # was never quiet. Measured locally on the real 66,380-season dataset:
      # two consecutive builds of the SAME IMDb dumps produced different
      # data.json bytes and identical content.
      #
      # What makes it real: build-data.js now also stamps `contentHash`, a
      # sha256 (16 hex chars) over everything in data.json EXCEPT builtAt and
      # the hash itself. On that same two-build experiment both runs hashed to
      # 08eeaec95bea8e6d.
      #
      # show-modal-extras.json is compared byte for byte and is part of the
      # decision on purpose: it carries no timestamp (so the compare is honest)
      # and cast strips plus per-episode titles / runtimes / IMDb ids live ONLY
      # in that file, so a TMDB pass can change it while data.json is
      # bit-identical. Gating on data.json alone would ship a stale monolith.
      #
      # Fail-open everywhere: no baseline, an unreadable baseline, or a
      # data.json without a contentHash all count as CHANGED. The worst case is
      # exactly today's behaviour (upload + PR); a real refresh is never
      # skipped because the gate was unsure.
      - name: Detect content change
        id: change
        run: |
          set -e
          hash_of() {
            [ -f "$1" ] || { printf ''; return; }
            node --max-old-space-size=4096 -e '
              const fs = require("fs");
              try {
                const d = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                process.stdout.write(String(d.contentHash || ""));
              } catch (e) { process.stdout.write(""); }
            ' "$1"
          }
          NEW=$(hash_of apps/rising-shows/data.json)
          PREV=$(hash_of /tmp/rs-prev/data.json)
          BASELINE=false
          [ -f /tmp/rs-prev/data.json ] && BASELINE=true

          if [ -z "$NEW" ]; then
            echo "::warning::data.json carries no contentHash; assuming the data changed."
            CHANGED=true
          elif [ -z "$PREV" ]; then
            echo "No baseline contentHash (missing or pre-contentHash asset); assuming the data changed."
            CHANGED=true
          elif [ "$NEW" != "$PREV" ]; then
            CHANGED=true
          elif ! cmp -s apps/rising-shows/data/show-modal-extras.json /tmp/rs-prev/show-modal-extras.json; then
            echo "data.json content is unchanged but show-modal-extras.json differs."
            CHANGED=true
          else
            CHANGED=false
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "contentHash new=${NEW:-none} prev=${PREV:-none} baseline=$BASELINE changed=$CHANGED"

      - name: Build changelog entry
        # Diffs the new data.json against the previous release version and
        # appends a summary to apps/rising-shows/changelog.json. Powers the
        # "What's new" popover in the footer. Skipped when the content is
        # unchanged: there is nothing to record.
        if: steps.change.outputs.changed == 'true'
        run: |
          if [ "${{ steps.change.outputs.baseline }}" != "true" ]; then
            echo "::warning::no baseline data.json, so today's changelog entry cannot be built; the What's new chip will keep showing the previous entry"
            exit 0
          fi
          node apps/rising-shows/scripts/build-changelog.js --prev /tmp/rs-prev/data.json

      - name: Regenerate integration exports
        # Kometa/MDBList artifacts under exports/ (shape collections, Show
        # Finder preset collections, season overlays, ID lists) are derived
        # from data.json and committed so NAS-side Kometa can pull them from
        # raw GitHub URLs. Rebuild them whenever the data refreshes.
        run: node apps/rising-shows/scripts/export-integrations.js

      # Gate on THIS app's own suites, not the whole repo.
      #
      # This step used to run `npm test`, so a failing test in any of the
      # any other app blocked the data refresh. That is exactly what
      # happened on 2026-08-23 and again on 08-28 through 08-31: an
      # fpl-planner test failed, this step stopped the job before the release
      # upload, and the live site served 2026-08-27 data until 09-01 with
      # nothing on the page saying so (the staleness badge only fires at 30
      # days). Four days of silence for a reason that had nothing to do with
      # Rising Shows.
      #
      # What this step actually protects is the artifacts THIS job commits:
      # the changelog, the Kometa/MDBList exports and the split index, all
      # covered by the Rising Shows suite, plus the site-wide static
      # invariants (sitemaps, internal links) that the generated pages feed.
      # The rest of the estate is gated on every PR and on every push to
      # master, which is where it belongs.
      - name: Run tests
        run: npm run test:rising-shows && npm run test:static

      # Check the DATA this run produced, not just the code that produced it.
      #
      # Every test above builds its own small fixture, which is the right way
      # to test build logic and leaves the 66,000-record file that actually
      # ships validated by nothing. Nothing downstream covers it either: the
      # bot PR's `tests` and `browser tests` runs never execute (GitHub does
      # not start workflow runs from GITHUB_TOKEN events, see the note on the
      # merge step below), and even when they did they would skip every
      # data-dependent check, because the dataset is gitignored and absent on
      # a runner. This job is the only place the real data exists, so it is
      # the only place it can be checked.
      #
      # Deliberately gating the UPLOAD, not the whole job: a dataset that
      # fails here must not replace the release asset, and the previous one
      # staying live is the safe outcome. The step needs the larger heap for
      # the same reason split-data does: the file is ~80 MB of JSON.
      - name: Validate the refreshed dataset
        if: steps.change.outputs.changed == 'true'
        run: node --max-old-space-size=4096 apps/rising-shows/scripts/validate-dataset.js

      # data.json and show-modal-extras.json live on the rolling
      # "rising-shows-data" release, not in git (the pair is ~150 MB per
      # refresh and was bloating the repo). show-modal-extras.json carries
      # cast strips, per-season overviews, and per-episode titles / runtimes
      # / IMDb ids for the modal, and it must be published alongside data.json
      # or new shows ship with no cast or episode titles on the live site.
      # IMMUTABLE NAMES FIRST, THEN THE ROLLING ONES (2026-09-05 audit F13).
      #
      # The rolling pair alone made every deploy - a documentation fix, a
      # rollback to last week's commit - pick up whatever data happened to be
      # on the release at that minute, including data whose review PR had not
      # merged. It also let the two files come from different refreshes, since
      # they are uploaded one after another.
      #
      # Each asset is therefore ALSO uploaded under a release-stamped name that
      # is never overwritten, and apps/rising-shows/data-release.json - which
      # names that release and carries the SHA-256 of both files - is committed
      # in the same pull request as the derived files below. A build resolves
      # the pin in its own commit, so code and data roll back together, and
      # fetch-data.js refuses a file whose digest does not match.
      #
      # The rolling names stay, uploaded LAST: a checkout without the pin (an
      # older commit, a fresh clone of a branch that predates it) still works
      # exactly as it did.
      - name: Upload data to the rising-shows-data release
        # Gated on the content hash (see "Detect content change"). The old
        # in-step `cmp -s` guard is gone: builtAt made it unreachable, so this
        # step pushed ~40 MB to the release every single day.
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p /tmp/rs-new
          gzip -9 -c apps/rising-shows/data.json > /tmp/rs-new/data.json.gz
          gzip -9 -c apps/rising-shows/data/show-modal-extras.json > /tmp/rs-new/show-modal-extras.json.gz

          RELEASE_ID="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          DATA_SHA="$(sha256sum /tmp/rs-new/data.json.gz | cut -d' ' -f1)"
          EXTRAS_SHA="$(sha256sum /tmp/rs-new/show-modal-extras.json.gz | cut -d' ' -f1)"
          DATA_BYTES="$(stat -c%s /tmp/rs-new/data.json.gz)"
          EXTRAS_BYTES="$(stat -c%s /tmp/rs-new/show-modal-extras.json.gz)"

          cp /tmp/rs-new/data.json.gz "/tmp/rs-new/data-${RELEASE_ID}.json.gz"
          cp /tmp/rs-new/show-modal-extras.json.gz "/tmp/rs-new/show-modal-extras-${RELEASE_ID}.json.gz"

          # Immutable copies first. If the job dies between the two uploads the
          # pin is not written either, so no commit can ever point at a half
          # published release.
          gh release upload rising-shows-data \
            "/tmp/rs-new/data-${RELEASE_ID}.json.gz" \
            "/tmp/rs-new/show-modal-extras-${RELEASE_ID}.json.gz"

          node -e '
            const fs = require("fs");
            const [releaseId, dataSha, dataBytes, extrasSha, extrasBytes] = process.argv.slice(1);
            fs.writeFileSync("apps/rising-shows/data-release.json", JSON.stringify({
              releaseId,
              builtAt: new Date().toISOString(),
              assets: {
                "data.json.gz": { sha256: dataSha, bytes: Number(dataBytes) },
                "show-modal-extras.json.gz": { sha256: extrasSha, bytes: Number(extrasBytes) },
              },
            }, null, 2) + "\n");
          ' "$RELEASE_ID" "$DATA_SHA" "$DATA_BYTES" "$EXTRAS_SHA" "$EXTRAS_BYTES"

          # The rolling names last, for checkouts with no pin.
          gh release upload rising-shows-data \
            /tmp/rs-new/data.json.gz \
            /tmp/rs-new/show-modal-extras.json.gz \
            --clobber

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      # Immutable assets accumulate ~40 MB a day, so the old ones are pruned.
      # KEEP is deliberately generous: it is how far back a rollback can reach,
      # and a commit older than the oldest kept release falls back to the
      # rolling names (correct data, just not the pinned one).
      - name: Prune superseded immutable assets
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          KEEP=14
          gh release view rising-shows-data --json assets \
            --jq '.assets[].name' \
            | grep -E '^data-[0-9]{8}-[0-9]{6}-[0-9a-f]{7}\.json\.gz$' \
            | sort -r | tail -n +$((KEEP + 1)) > /tmp/rs-prune-data || true
          while read -r name; do
            [ -n "$name" ] || continue
            stamp="${name#data-}"; stamp="${stamp%.json.gz}"
            echo "pruning release $stamp"
            gh release delete-asset rising-shows-data "$name" -y || true
            gh release delete-asset rising-shows-data "show-modal-extras-${stamp}.json.gz" -y || true
          done < /tmp/rs-prune-data

      # master is protected by a "PR before Merge" ruleset AND by classic
      # branch protection that requires the lint, test, browser and rules
      # checks, strictly (the branch must also be up to date). So a direct push
      # is rejected, and so is an immediate merge: `gh pr merge` cannot merge a
      # pull request whose required checks have not reported. That is why the
      # old "open it and merge it in the same breath" path stopped working on
      # 2026-09-07 and left #515 open. This step opens the pull request; the
      # next one hands it to scripts/bot-pr-autopilot.mjs, which releases the
      # approval hold on its runs and arms GitHub's own auto-merge. Branch
      # protection then decides, exactly as it does for a human pull request.
      #
      # WHAT IS COMMITTED, and why data-release.json belongs in the list.
      # The big pair lives on the release, not in git, but the PIN does live in
      # git: data-release.json names the immutable release id and carries the
      # SHA-256 of both files, and fetch-data.js resolves it at deploy time.
      # The upload step above has written it since 2026-09-07 and this commit
      # never added it, so no checkout has ever had one, every build took
      # fetch-data.js's compatibility fallback, and every deploy resolved the
      # ROLLING asset names again. That is the exact hole 2026-09-05 audit F13
      # set out to close: without the pin in the commit, a deploy triggered
      # while this pull request is open serves data whose review has not
      # happened. With it, a build resolves the dataset its own commit names,
      # so a refresh that fails CI cannot reach the site at all. (The very
      # first refresh after this change is still unpinned on master's side, for
      # the same reason: the hole closes for good once one of these merges.)
      #
      # Whenever the content changed, changelog.json changes too (the new entry
      # carries the new builtAt) and exports/README.md changes at minimum
      # through its own builtAt line, so this merge still fires on every real
      # refresh and remains the Netlify deploy trigger. That holds even when
      # the baseline download failed and the changelog step was skipped,
      # because the exports regeneration above still moves exports/README.md.
      #
      # The porcelain check below is not the gate (builtAt in
      # exports/README.md means it is never clean); it stays as a cheap
      # belt-and-braces guard against opening an empty pull request.
      #
      # The merge of origin/master after the commit is not cosmetic. Branch
      # protection is STRICT, so a pull request that is behind cannot merge
      # until it is updated, and every update costs another full round of
      # checks. This job checks out at 06:00 and opens its pull request hours
      # later, so being behind is the normal case, not the exception.
      - name: Open the refresh pull request
        id: open_pr
        if: steps.change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # --porcelain rather than `git diff`, because data-release.json is
          # UNTRACKED until the first of these commits lands and `git diff`
          # cannot see an untracked file at all.
          if [ -z "$(git status --porcelain -- \
              apps/rising-shows/changelog.json \
              apps/rising-shows/data-release.json \
              apps/rising-shows/exports/)" ]; then
            echo "No derived-file changes; nothing to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="bot/refresh-rising-shows-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "shevato-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add \
            apps/rising-shows/changelog.json \
            apps/rising-shows/data-release.json \
            apps/rising-shows/exports/
          git commit -m "chore(rising-shows): refresh data $DATE"

          git fetch --quiet origin master
          git merge --no-edit origin/master

          git push --set-upstream origin "$BRANCH"

          # tail -n1: gh writes the URL last, and anything it decides to add
          # before it would otherwise end up in the step output as the number.
          PR=$(gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "chore(rising-shows): refresh data $DATE" \
            --body "Automated refresh of IMDb + TMDB data. The dataset itself lives on the \`rising-shows-data\` release; \`apps/rising-shows/data-release.json\` in this pull request pins the immutable copy a build resolves, so nothing reaches the site until this merges." | tail -n1)
          echo "Opened $PR"
          echo "number=${PR##*/}" >> "$GITHUB_OUTPUT"

      # Release the approval hold GitHub puts on a bot-authored pull request's
      # runs, arm auto-merge, and watch until GitHub merges it.
      #
      # This step replaced "merge immediately, without any pull-request
      # checks". It cannot merge anything past a red check: it arms GitHub's
      # own auto-merge, and branch protection is what decides. A failure leaves
      # the pull request OPEN, with the data on the release under an immutable
      # name that only this pull request's data-release.json points at, so the
      # site keeps serving the previous build until someone looks. That is the
      # intended failure mode.
      #
      # delete_branch_on_merge is on for this repository, so GitHub deletes
      # bot/refresh-rising-shows-* on merge and nothing here has to clean up.
      #
      # 75 minutes is the watch window. The four required checks cost about 15
      # minutes together on a change like this one (lint ~1, test ~2, browser
      # ~12 across four shards, rules ~1 because its Scope step finds no
      # emulator inputs), and the window has to hold a second round in case
      # master moves and the branch has to be updated.
      - name: Drive the pull request through CI and auto-merge
        if: steps.open_pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Through the environment rather than interpolated into the command,
          # the same rule bot-pr-autopilot.yml follows for its dispatch inputs.
          PR: ${{ steps.open_pr.outputs.number }}
        run: node scripts/bot-pr-autopilot.mjs run --pr "$PR" --timeout-min 75
