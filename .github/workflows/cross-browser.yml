name: cross-browser smoke

# Firefox + WebKit smoke coverage of every page and app. Chromium depth lives
# in the browser-tests workflow (the CDP harness); this run exists solely to
# catch engine-specific breakage in the other two engines the README promises
# support for.
#
# It is the ONLY workflow that installs npm dependencies (Playwright is a dev
# dependency used by tests/cross-browser/ alone). The push/PR workflows stay
# dependency-free on purpose. Weekly rather than per-PR: the suite is a wide
# shallow smoke over hand-written vanilla JS, where engine regressions arrive
# with browser releases, not with individual commits.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps firefox webkit

      # The smoke suite asserts that no first-party request 404s, and the
      # Rising Shows finder fetches data-index.json at boot. That file is a
      # build artifact (gitignored, derived from data.json by split-data.js),
      # so a bare checkout serves a 404 and both "all app pages boot clean"
      # tests fail in every engine - which is a missing build prerequisite,
      # not the engine breakage this workflow exists to catch.
      #
      # The push/PR workflows deliberately skip this (browser-tests.yml says
      # so: 111 MB per pull request is not worth six data-dependent checks).
      # Weekly is a different trade: the download is public, unauthenticated
      # and takes seconds, and it buys a smoke run against the same artifact
      # set the deploy serves. Only the two scripts the finder's boot path
      # needs are run; build-show-pages / build-exercise-pages generate ~35k
      # SEO pages this suite never visits, so build:site would be pure cost.
      - name: Prepare the Rising Shows dataset
        run: |
          npm run fetch:rising-shows-data
          npm run build:rising-shows:split

      - name: Run cross-browser smoke suite
        run: npm run test:cross-browser
