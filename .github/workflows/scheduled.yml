name: scheduled

# Weekly deeper validation: the things that drift WITHOUT a commit, and the
# checks too slow or too broad to earn a place on every pull request.
#
#   full ........... the whole `ci` pipeline against master's tip. Pushes to
#                    master are mostly skipped now (their tree already passed on
#                    the pull request), so this is what notices a runner-image
#                    change: a new Chrome, a new Java. The Arena rules suite runs
#                    unscoped here, which covers emulator and tooling drift.
#   coverage ....... per-area line-coverage floors (tests/coverage/floors.json),
#                    measured in shards and judged together.
#                    It re-runs the unit estate under V8 coverage, which costs
#                    about 2.5 times as much (606 s against 245 s on a runner,
#                    2026-09-14) and up to eight times as much for one file,
#                    and coverage moves over weeks.
#   cross-browser .. Firefox + WebKit smoke of every page and app. Engine
#                    regressions arrive with browser releases, not with commits.
#   mutation ....... the FPL Planner's curated mutation check: breaks each
#                    guarded rule on purpose and expects its tests to go red
#                    (apps/fpl-planner/scripts/mutation-check.mjs). A test that
#                    cannot fail looks exactly like one that passes, and every
#                    mutant is a full test-file run, so it is weekly; the table
#                    itself is checked on every pull request by
#                    apps/fpl-planner/tests/mutation-check.test.mjs.
#   fpl-archive .... the FPL Planner's tests against the REAL season archive
#                    (player identity across seasons, double-gameweek dedupe).
#                    They skip without the gitignored .data download, so on
#                    every pull request five of them skipped and none had ever
#                    run on CI (found 2026-10-17). The archive is a third
#                    party's moving git branch, so it is fetched here, weekly,
#                    and never on the pull-request path, and the job fails if
#                    any of them still skips.
#   future-clock ... the unit estate at future dates and at both ends of the
#                    time zones, so a test tied to the real clock fails here
#                    before it can hold a pull request.
#
# Formerly three separate schedules (test.yml's coverage job on Wednesday,
# arena-rules.yml on Tuesday, cross-browser.yml on Monday); one run means one
# place to look.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  full:
    uses: ./.github/workflows/ci.yml

  # Coverage is split across runners because one took 21 to 44 minutes for the
  # same code on 2026-11-09, against this limit. A share measures only its own
  # files; `coverage` below combines the shares and enforces the floors.
  coverage-shard:
    runs-on: ubuntu-24.04
    # The runner bounds each test file at 20 minutes (FILE_TIMEOUT_MS in
    # tests/coverage/run.mjs), and a hung file can start late in the run; 45
    # leaves room for that bound to fire and name the file.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      # The same estate as the `test` job: without the dataset the real-catalogue
      # tests skip, and the coverage run read 16 skips to the unit job's 7.
      - name: Rising Shows dataset
        uses: ./.github/actions/rising-shows-dataset
      - name: Coverage (share ${{ matrix.shard }})
        run: node tests/coverage/run.mjs --shard ${{ matrix.shard }}/${{ strategy.job-total }}
      # On a failure too: the verdict below reports which tests failed.
      - name: Keep this share's result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage/shard-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  # The coverage verdict: every share present, every test file run exactly once,
  # and the floors enforced on the union. It runs whatever the shares did, so a
  # failed or lost share is a red verdict with the reason, never a skipped one.
  coverage:
    needs: coverage-shard
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Download every share's result
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: .coverage/shards
      - name: Coverage floors over the combined shares
        run: node tests/coverage/run.mjs --merge .coverage/shards --total 3

  cross-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      # Playwright is a dev dependency used by tests/cross-browser/ alone.
      - name: Install dev dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps firefox webkit
      # The smoke asserts no first-party request 404s, and the Rising Shows
      # finder fetches its index at boot: a missing build prerequisite, not the
      # engine breakage this job exists to catch.
      - name: Prepare the Rising Shows dataset
        run: |
          npm run fetch:rising-shows-data
          npm run build:rising-shows:split
      # CROSS_BROWSER_REQUIRE=1 turns the harness's launch-failure SKIP into a
      # failure: without it this job once went green having tested one engine.
      - name: Run cross-browser smoke suite
        env:
          CROSS_BROWSER_REQUIRE: '1'
        run: npm run test:cross-browser

  mutation:
    runs-on: ubuntu-24.04
    # Split across runners because one could no longer hold the table: on two
    # workers it was cancelled at this limit on 2026-10-26, 11-02 and 11-09,
    # and a cancelled run prints no result table. On three shards the worst of
    # nine GitHub runs took 15 minutes 15 s, so four leave real room.
    # tests/mutation-check.test.mjs fails `npm test` if the table
    # outgrows the limit, and a hang is bounded by the check's own 10-minute
    # limit per mutant. Plain node, no npm install: the check copies the app
    # into a temp dir and runs `node --test` there.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: FPL Planner mutation check (share ${{ matrix.shard }})
        run: npm run test:mutation:fpl -- --shard ${{ matrix.shard }}/${{ strategy.job-total }}

  # The estate at the dates and zones it will meet. A test frozen against the
  # real clock passes until the day it does not, and then fails on whichever
  # pull request runs next: #650, the data refresh, was held for days by one
  # (FPL ledger row 45). Run ahead of time, the same test fails here first, a
  # week before it can block anything. The CPU budget files are left out by
  # the share itself: they are compared on their own runner.
  future-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: next-weekly-run, shift: '+8 days', tz: UTC }
          - { label: five-weeks-on, shift: '+35 days', tz: UTC }
          - { label: six-months-on, shift: '+180 days', tz: UTC }
          - { label: furthest-ahead-zone, shift: '', tz: Pacific/Kiritimati }
          - { label: furthest-behind-zone, shift: '', tz: Etc/GMT+12 }
    name: future-clock (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v6
        with:
          # privacy-review-date compares the policy with git history.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Rising Shows dataset
        uses: ./.github/actions/rising-shows-dataset
      - name: Unit estate at this date and zone
        env:
          TZ: ${{ matrix.tz }}
          SHIFT: ${{ matrix.shift }}
        run: |
          if [ -n "$SHIFT" ]; then
            FAKE_NOW=$(date -u -d "$SHIFT" +%Y-%m-%dT%H:%M:%SZ)
            export FAKE_NOW
            export NODE_OPTIONS="--import $GITHUB_WORKSPACE/apps/fpl-planner/tests/helpers/shift-clock.mjs"
            echo "the clock reads $FAKE_NOW"
          fi
          node scripts/test-shard.mjs 1/1

  fpl-archive:
    runs-on: ubuntu-24.04
    # Five CSVs of a few megabytes each, then two test files that take
    # seconds; 15 bounds a stalled download.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      # Exits non-zero, saying which season, if any file cannot be fetched.
      - name: Download the season archive
        run: node apps/fpl-planner/scripts/fetch-history.mjs
      - name: Real-archive tests, with nothing skipped
        run: |
          set -o pipefail
          node --test --test-reporter=tap apps/fpl-planner/tests/player-identity.test.mjs \
            apps/fpl-planner/tests/train-dedupe.test.mjs | tee archive.tap
          grep -qx '# skipped 0' archive.tap || { echo "::error::an archive test skipped, so the download did not give it what it needs"; exit 1; }
