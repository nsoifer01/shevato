name: browser tests

# Runs the end-to-end browser suite on pull requests, so interaction and layout
# regressions are caught before merge rather than by someone remembering to run
# it locally.
#
# Separate from `tests` on purpose: that workflow is pure Node and finishes in
# a few minutes, while this one needs a browser and takes far longer. Keeping them apart
# means a slow browser run never delays the fast feedback from unit tests.
on:
  pull_request:
  # Also on push to master: branch protection makes direct pushes rare, but a
  # merge that lands without a fresh PR run should still get browser coverage.
  #
  # Known gap, not fixable here: the daily Rising Shows refresh merges its bot
  # PR with GITHUB_TOKEN, and GitHub does not start workflow runs from
  # GITHUB_TOKEN-driven events, so neither the bot PR runs (they sit at
  # action_required) nor this push trigger ever fire for those merges. See the
  # note on the "Open and merge PR" step in refresh-rising-shows.yml for what
  # the owner would have to set up to change that.
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  browser-shard:
    runs-on: ubuntu-latest

    # The estate is 28 suites and 1,982 checks, walked one suite at a time in
    # one browser: 46 minutes on a single runner (measured 2026-09-05, and it
    # used to be CANCELLED at the old 45-minute cap, which reads as a failure
    # and hides everything that had already passed).
    #
    # Where that time goes, now that run.mjs measures it rather than anyone
    # counting `sleep()` literals: 60% fixed waits, 20% navigation, 6%
    # condition polling. Server and browser startup together are 0.8 SECONDS
    # for the whole run, so sharing them across suites would save nothing; more
    # machines is the only lever, plus removing waiting that buys nothing.
    #
    # So the suites are split across parallel runners. Each shard gets its own
    # machine, its own static server and its own Chrome, which is what makes
    # this safe: two runs on ONE machine would share CDP port 9222 and silently
    # drive each other's browser (the runner bind-tests both ports and refuses
    # to start for exactly that reason). The same isolation is what makes
    # `npm run test:browser:parallel` safe locally.
    #
    # `strategy.job-total` is the matrix size itself, so the shard count is
    # never written down twice and cannot drift. run.mjs re-partitions on its
    # own and prints the suites each shard owns, with the cost it expects.
    #
    # THE SPLIT IS BY MEASURED COST, NOT BY SUITE COUNT. Round-robin balanced
    # the count, and suite costs span two orders of magnitude, so it handed
    # shard 3 twenty minutes of work while 1, 2 and 4 finished in eight or nine
    # and sat idle: the estate's wall clock is its slowest shard, so that one
    # runner WAS the pull-request gate. run.mjs now packs the shards
    # longest-first from a table of measured seconds. Four shards land within
    # 5% of each other (verified locally: 691/699/721/725 s).
    strategy:
      # One shard failing must not cancel its siblings. The estate exists to
      # tell you everything that is broken, not the first thing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    # Per SHARD, not per estate. A cost-packed quarter of the estate is about
    # ten minutes; the cap leaves generous room for slow silicon and for a
    # suite whose measured cost has drifted from the table in run.mjs (which
    # makes a shard uneven, never wrong).
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v6
        with:
          # Enough history to resolve BOTH parents of a merge commit, which the
          # already-tested guard below needs.
          fetch-depth: 3

      # Has this exact tree already been tested?
      #
      # Merging an up-to-date pull request produces a merge commit whose TREE is
      # byte-identical to the PR head that went green minutes earlier, so this
      # push-to-master run would re-test, bit for bit, a tree already known
      # good - 46 runner-minutes of it. Measured 2026-09-05: identical for PRs
      # #472, #473 and #474; DIFFERENT for #471, whose branch was behind master
      # and whose merge therefore produced a combination no run had ever seen.
      # So this cannot be a blanket removal of the push trigger, it has to be
      # the tree comparison.
      #
      # A step rather than a separate gating job on purpose: a job would show up
      # as another check on every pull request, and the point of this round was
      # to make the check list shorter. A skipped shard then costs a checkout
      # and a node setup instead of a quarter of the estate.
      #
      # Fails OPEN in every uncertain case: a non-merge push, a second parent
      # that cannot be resolved, or any event that is not a `push`. When it
      # skips, the shard still SUCCEEDS, so the `browser` aggregator below needs
      # no special case.
      - name: Already tested?
        id: guard
        run: |
          set -e
          if [ "${{ github.event_name }}" != 'push' ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "event is ${{ github.event_name }}, always run"
            exit 0
          fi
          head_tree="$(git rev-parse 'HEAD^{tree}')"
          if ! merged_tree="$(git rev-parse -q --verify 'HEAD^2^{tree}' 2>/dev/null)"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "not a merge commit, or the second parent is unavailable"
            exit 0
          fi
          if [ "$head_tree" = "$merged_tree" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "tree $head_tree is the merged branch head, already tested on its pull request"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "the merge produced tree $head_tree, which no pull-request run ever saw"
          fi

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      # Chrome ships on the GitHub runner image. Resolve it rather than assuming
      # a name, so an image change surfaces as a clear error here instead of a
      # confusing timeout waiting for a debugging port that never opens.
      - name: Resolve browser
        if: steps.guard.outputs.run == 'true'
        run: |
          set -e
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME_BIN=$c" >> "$GITHUB_ENV"
              echo "Using $c: $("$c" --version)"
              exit 0
            fi
          done
          echo "No Chrome/Chromium found on the runner image." >&2
          exit 1

      # The rising-shows dataset is gitignored and lives on a rolling GitHub
      # release. Without it, 64 assertions across three suites do not run on a
      # pull request: apps/rising-shows/e2e/audit-2026-08.mjs reports 0/0 and
      # 11 skips (every assertion it owns), suites/apps.mjs skips 10 and
      # suites/perf.mjs skips its 3 rising-shows budget rows. That suite had
      # never once executed on a pull request.
      #
      # The trade this workflow used to make - "111 MB per PR is not worth
      # those assertions" - was made before anyone counted them, and before
      # cross-browser.yml demonstrated the download is public, unauthenticated
      # and quick. Cached on the release tag, it is a restore on all but the
      # first run after a refresh.
      #
      # continue-on-error is the important part: if the release is unreachable
      # or rate-limited, the suites fall back to exactly today's behaviour
      # (reported skips) instead of turning a pull request red for a reason
      # that has nothing to do with the change under review. Never a silent
      # pass either - run.mjs names any suite that asserted nothing.
      - name: Cache the Rising Shows dataset
        id: rs-cache
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          # shows-index.json is what the FINDER boots from, and it is the file
          # the suites' data guards actually test for. It was missing from this
          # list while data-index.json (the guard below) was in it, so every
          # run after the first cache save restored a dataset the app could not
          # boot, short-circuited the rebuild, and silently skipped all 64
          # rising-shows assertions. That is how the low-confidence badge
          # shipped a 4.12:1 contrast regression past four green shards.
          path: |
            apps/rising-shows/data.json
            apps/rising-shows/data-index.json
            apps/rising-shows/shows-index.json
            apps/rising-shows/data
          key: rising-shows-data-${{ hashFiles('apps/rising-shows/scripts/fetch-data.js', 'apps/rising-shows/scripts/split-data.js') }}-${{ github.run_id }}
          restore-keys: |
            rising-shows-data-${{ hashFiles('apps/rising-shows/scripts/fetch-data.js', 'apps/rising-shows/scripts/split-data.js') }}-
            rising-shows-data-

      - name: Prepare the Rising Shows dataset
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: |
          set -e
          # Gate on what the SUITES gate on (shows-index.json plus a detail
          # shard), never on a file that merely happens to be cheap to check.
          # A cache that holds the raw download but not the split output is a
          # partial hit: split it rather than skipping the whole dataset.
          if [ -s apps/rising-shows/shows-index.json ] \
            && [ -s apps/rising-shows/data-index.json ] \
            && [ -d apps/rising-shows/data/detail ]; then
            echo "dataset restored from cache"
          elif [ -s apps/rising-shows/data.json ] \
            && [ -s apps/rising-shows/data/show-modal-extras.json ]; then
            echo "cache held the raw dataset but not the split output; splitting"
            npm run build:rising-shows:split
          else
            npm run fetch:rising-shows-data
            npm run build:rising-shows:split
          fi

      # What is NOT skipped either way, and was the reason the old trade was
      # still defensible:
      #
      # the perf suite's rising-shows boot-network contract builds a ~6 KB fixture
      # dataset at test time by running the real scripts/split-data.js, serves
      # it through CDP interception, and asserts which dataset URLs the app
      # fetches (index only at boot, never data.json, never the extras
      # monolith, one detail file per show open, nothing on reopen). That runs
      # here on every pull request and needs no download, so it holds even when
      # the fetch above fails.
      #
      # The run prints the suites this shard owns before it starts, so the
      # shard logs side by side are the audit that the estate was fully run.
      - name: Run browser regression suite
        if: steps.guard.outputs.run == 'true'
        run: npm run test:browser -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # One verdict for the whole estate, so "did the browser suite pass?" has a
  # single answer even though four jobs produce it, and so a required status
  # check has one stable name to point at if the owner ever adds one.
  #
  # `if: always()` is what makes it mean anything: without it, a cancelled or
  # skipped shard would leave this job skipped too, which reads as "nothing to
  # see here" rather than "the estate did not run". For a matrix job,
  # `needs.<job>.result` is success only when every shard succeeded.
  browser:
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every shard passed
        run: |
          result='${{ needs.browser-shard.result }}'
          echo "browser-shard result: $result"
          if [ "$result" != 'success' ]; then
            echo "::error::the browser estate did not pass (shards: $result)"
            exit 1
          fi
