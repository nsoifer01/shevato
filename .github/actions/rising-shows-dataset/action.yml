name: Rising Shows dataset
description: >
  Restores the gitignored Rising Shows dataset from the cache keyed by its
  committed pin, downloads and splits it on a miss, and saves it. One
  definition for every job that needs the real catalogue.

# THE RISING SHOWS DATASET. Gitignored, published on a GitHub release, pinned by
# apps/rising-shows/data-release.json. Browser suites and the real-catalogue
# unit tests assert against it, so it is a precondition, not an optional extra:
# it used to be `continue-on-error`, which let a failed download turn 64
# browser assertions into skips and a green shard that checked less than the
# last one. A failure here fails the job.
#
# The key is the PIN, not the run id. A run-id key saved a fresh ~100 MB entry
# on every run (evicting the Arena emulator cache under the 10 GB limit) and
# never produced an exact hit; the pin changes only when the refresh bot
# publishes new data. Measured 2026-09-14 (PR #542): a hit restores in 2-4 s, a
# miss costs 8-13 s (download, split, save).
#
# Explicit files, never the data/ directory: data/ also holds a TRACKED file
# (season-overviews.json), and restoring the directory overwrote the pull
# request's copy with whatever the cache had saved.
#
# Pinned by tests/static/ci-rising-shows-dataset.test.mjs, which runs the real
# Prepare script below against canned trees.

runs:
  using: composite
  steps:
    - name: Restore the Rising Shows dataset
      id: rs-cache
      uses: actions/cache/restore@v5
      with:
        path: |
          apps/rising-shows/data.json
          apps/rising-shows/data-index.json
          apps/rising-shows/shows-index.json
          apps/rising-shows/data/show-modal-extras.json
          apps/rising-shows/data/kometa-index.json
          apps/rising-shows/data/detail
        key: rising-shows-dataset-${{ hashFiles('apps/rising-shows/data-release.json', 'apps/rising-shows/scripts/fetch-data.js', 'apps/rising-shows/scripts/split-data.js') }}

    - name: Prepare the Rising Shows dataset
      shell: bash
      run: |
        set -e
        # Gate on what the CONSUMERS gate on (shows-index.json plus a detail
        # shard), never on a file that merely happens to be cheap to check.
        # A cache that holds the raw download but not the split output is a
        # partial hit: split it rather than skipping the whole dataset.
        if [ -s apps/rising-shows/shows-index.json ] \
          && [ -s apps/rising-shows/data-index.json ] \
          && [ -d apps/rising-shows/data/detail ]; then
          echo "dataset restored from cache"
        elif [ -s apps/rising-shows/data.json ] \
          && [ -s apps/rising-shows/data/show-modal-extras.json ]; then
          echo "cache held the raw dataset but not the split output; splitting"
          npm run build:rising-shows:split
        else
          npm run fetch:rising-shows-data
          npm run build:rising-shows:split
        fi

    # Several jobs of one run can miss together; the first save wins and the
    # rest log "Unable to reserve cache", which is harmless.
    - name: Save the Rising Shows dataset
      if: steps.rs-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          apps/rising-shows/data.json
          apps/rising-shows/data-index.json
          apps/rising-shows/shows-index.json
          apps/rising-shows/data/show-modal-extras.json
          apps/rising-shows/data/kometa-index.json
          apps/rising-shows/data/detail
        key: rising-shows-dataset-${{ hashFiles('apps/rising-shows/data-release.json', 'apps/rising-shows/scripts/fetch-data.js', 'apps/rising-shows/scripts/split-data.js') }}
