[build]
  # build:site on every deploy: fetch the Rising Shows data release,
  # regenerate the Rising Shows show pages and the Gym Tracker exercise
  # pages (and their sitemaps), split the data, then stamp sitemap
  # lastmod values from git (scripts/stamp-sitemap-index.mjs). The
  # generated output (apps/rising-shows/shows/, apps/gym-tracker/
  # exercises/) is intentionally gitignored.
  command = "npm run build:site"
  functions = "netlify/functions"
  # AN EXPLICIT PUBLISH DIRECTORY (2026-09-05 audit F15).
  #
  # Netlify used to publish the repo root, so /FINDINGS.md, /TESTING-AUDIT.md
  # and /netlify/functions/lib/tp-assist-quota.mjs all returned 200 in
  # production. robots.txt hid them with Disallow, which is a crawling hint
  # and not an access control, and it left every future internal file one
  # commit away from being a public artifact by default.
  #
  # build:site's last step assembles dist/ from an explicit allow list
  # (scripts/build-publish-dir.mjs); tests/static/publish-graph.test.mjs
  # asserts in both directions - that no page, module or precache entry points
  # at something the list excludes, and that the named internal artifacts are
  # gone.
  #
  # `functions` above is still the repo path: Netlify bundles functions from
  # the repository, not from the publish directory, so they keep deploying
  # while their source stops being downloadable.
  publish = "dist"

# The build and the functions both run on the version .nvmrc names. Netlify
# reads NODE_VERSION for the BUILD; the functions runtime is pinned separately
# below, because a function inheriting whatever the platform defaults to is how
# a runtime moves under you without a commit. Node 20 reached end-of-life
# before the 2026-09-05 audit; 22 is the active LTS.
[build.environment]
  NODE_VERSION = "22"
  # The FUNCTIONS runtime, pinned separately from the build's Node. There is no
  # `node_version` under [functions] - the config schema reads that key as a
  # per-function scope object and refuses the file outright, which is how the
  # first attempt at this failed every deploy check on PR #506 with
  # "functions.node_version must be an object". AWS_LAMBDA_JS_RUNTIME is the
  # documented mechanism, and it keeps the pin explicit: a function that
  # inherits whatever the platform defaults to is a runtime that moves under
  # you without a commit. Matches NODE_VERSION and .nvmrc; @netlify/blobs 10.x
  # and the conditional-write path in lib/blob-cas.mjs are exercised on it by
  # netlify/functions/tests/blobs-version.test.mjs.
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "esbuild"

# Local dev only (netlify dev); no effect on deploys. Pins the dev server
# to one address instead of a random port per run, serving the repo root
# like production does. 8888 on purpose: 8080 and 8081 are reserved on the
# owner's machine (never a dev server), and plain static servers go on 8082+.
[dev]
  port = 8888
  publish = "."

# ---------------------------------------------------------------------------
# URL canonicalisation.
#
# Netlify's Pretty URLs serves every committed `foo.html` at BOTH /foo.html
# and /foo, with a 200 on each and no redirect between them. Nothing here
# used to collapse the pair, so one page was reachable at two live URLs:
# GA4 filed them as two rows (/apps 11 views vs /apps.html 13), and Google
# saw a duplicate it had to resolve via the canonical tag.
#
# Direction of travel is extensionless, because that is what every page's
# <link rel="canonical"> and sitemap-pages.xml already declare - so these
# redirects make the server agree with what we had been claiming, and
# nothing needs re-indexing.
#
# force = true on each: the .html file physically exists, and without force
# static file serving wins and the redirect never runs.
#
# NOTE: google10670283c9d04acd.html is deliberately absent. Search Console
# fetches that exact .html path to verify domain ownership; redirecting it
# would fail verification. Every rule below names one page for that reason -
# a blanket *.html rule would have caught it.
# ---------------------------------------------------------------------------

# "/" must be a clean edge 301 so Google indexes the real homepage. force
# makes this win over the committed index.html stub (which previously served
# at "/" carrying a noindex meta that de-indexed the domain root - GSC,
# 2026-06). The stub remains only as a local-dev / no-JS fallback.
#
# Targets /home, not /home.html: this redirect is the site's single busiest
# entry point, and pointing it at the non-canonical variant is what drove
# 279 of 624 page views onto /home.html while /home recorded almost none.
[[redirects]]
  from = "/"
  to = "/home"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/home"
  status = 301
  force = true

[[redirects]]
  from = "/home.html"
  to = "/home"
  status = 301
  force = true

[[redirects]]
  from = "/apps.html"
  to = "/apps"
  status = 301
  force = true

[[redirects]]
  from = "/work.html"
  to = "/work"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/privacy.html"
  to = "/privacy"
  status = 301
  force = true

[[redirects]]
  from = "/moadon-alef.html"
  to = "/moadon-alef"
  status = 301
  force = true

# Directory-index duplicates. Every generated page under shows/ and
# exercises/ was reachable both as `/…/slug/` and `/…/slug/index.html`,
# doubling the potential URL space for ~34,800 generated pages. Named
# placeholders (:slug) rather than a splat, so the rule cannot escape the
# directory it is meant to tidy.
[[redirects]]
  from = "/apps/rising-shows/shows/:slug/index.html"
  to = "/apps/rising-shows/shows/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/apps/gym-tracker/exercises/:slug/index.html"
  to = "/apps/gym-tracker/exercises/:slug/"
  status = 301
  force = true

[[redirects]]
  from = "/apps/:app/index.html"
  to = "/apps/:app/"
  status = 301
  force = true

# The two generated hub indexes sit between the rules above (one level too
# shallow, one too deep), so they were reachable as 200 duplicates.
[[redirects]]
  from = "/apps/rising-shows/shows/index.html"
  to = "/apps/rising-shows/shows/"
  status = 301
  force = true

[[redirects]]
  from = "/apps/gym-tracker/exercises/index.html"
  to = "/apps/gym-tracker/exercises/"
  status = 301
  force = true

# The Kometa builder sits one level deeper than the rule above reaches.
[[redirects]]
  from = "/apps/rising-shows/kometa/index.html"
  to = "/apps/rising-shows/kometa/"
  status = 301
  force = true

# product.html was retired as part of the marketing/portfolio refresh.
# Its services content now lives at the top of /work. Permanent redirect so
# anyone with a bookmark or inbound link lands cleanly.
#
# Targets /work rather than /work.html: since /work.html now 301s to /work,
# the old target would have made this a two-hop redirect chain, which costs
# a round trip and dilutes the link signal Google passes through.
[[redirects]]
  from = "/product.html"
  to = "/work"
  status = 301
  force = true

# Extensionless variant in case anyone bookmarked /product without .html.
[[redirects]]
  from = "/product"
  to = "/work"
  status = 301
  force = true

# Mario Kart was renamed from tracker.html to index.html so every app shares
# the same entry filename. Permanent redirect preserves inbound links and
# anything Google already has indexed.
[[redirects]]
  from = "/apps/mario-kart/tracker.html"
  to = "/apps/mario-kart/"
  status = 301
  force = true

# Brain Arena was rebranded to "Arena" (it's no longer trivia-only; it's a
# hub for private-room party games with friends). The directory moved from
# /apps/brain-arena/ → /apps/arena/. The splat catches every deep link
# (success page, future per-game routes) so existing bookmarks + indexed
# pages forward cleanly.
[[redirects]]
  from = "/apps/brain-arena/*"
  to = "/apps/arena/:splat"
  status = 301
  force = true

# Rising Seasons was rebranded to "Rising Shows" and refocused from browsing
# individual seasons to ranking whole shows by the shape of their rating
# trend. The directory moved from /apps/rising-seasons/ → /apps/rising-shows/.
# The splat catches every deep link (the ~400 per-show SEO pages, the kometa
# builder, the A-Z index) so existing bookmarks and indexed pages forward
# cleanly with a permanent 301.
[[redirects]]
  from = "/apps/rising-seasons/*"
  to = "/apps/rising-shows/:splat"
  status = 301
  force = true

# Trip Planner started life as tools/trip-planner.html before graduating to
# a full app; keep the old URL working (extensionless variant included).
[[redirects]]
  from = "/tools/trip-planner*"
  to = "/apps/trip-planner/"
  status = 301
  force = true

# Baseline security headers for every response.
#
# TWO CSP HEADERS, and the split is the point (2026-09-05 audit F14).
#
# Content-Security-Policy (ENFORCED) carries the directives that are
# compatible with this site TODAY and are checked to be so: no committed page
# contains an <object>, <embed>, <applet> or <base> element, and no <form>
# carries an action attribute (every form here is handled in-page by JS).
# tests/static/csp-enforced.test.mjs asserts all of that against the tree, and
# tests/browser/suites/csp.mjs loads real pages behind this exact header in
# Chrome and proves an injected <object> and an injected <base> are BLOCKED
# while the apps still work.
#
# This used to be one report-only header and nothing else. The reason given
# was inline styles - and inline styles have nothing to do with object-src or
# base-uri, so a whole class of injection defence sat switched off waiting on
# an unrelated blocker. `script-src`/`style-src` are the parts that genuinely
# still need 'unsafe-inline' (apps.html and the Trip Planner ship inline
# <script> blocks; jQuery writes element styles at runtime), and those stay in
# the report-only policy below until they can be nonced or hashed.
#
# frame-ancestors 'none' is here rather than only X-Frame-Options: the header
# is the modern spelling and takes precedence where both are understood.
#
# Content-Security-Policy-Report-Only (below) is the INTENDED end state,
# unchanged, plus a report endpoint - see /.netlify/functions/csp-report,
# which records a directive and an ORIGIN and never a path, a query or a
# referrer. Without a destination the report-only policy produced console
# output nobody reads, which is how three Trip Planner origins sat missing
# from connect-src for weeks.
#
# connect-src is derived from every fetch() call site in client JS, not
# from memory - it drifted badly once already (2026-07-20 audit) and a
# Report-Only policy gives no feedback when it does, which is exactly how
# three Trip Planner origins (photon.komoot.io, api.open-meteo.com,
# geocoding-api.open-meteo.com) sat here missing until 2026-08-18. That
# drift is now a test: tests/static/csp-connect-src.test.mjs parses THIS
# header and fails when a browser fetch origin is not covered by it, so
# adding a fetch to a new origin means adding it here in the same change.
# Current non-obvious entries: *.googleapis.com already covers Gemini
# (generativelanguage), Places and Firestore; raw.githubusercontent.com
# is the Trip Planner visa matrix; the three Open-Meteo hosts are
# separate origins for separate products (typical weather = archive-api,
# near-term forecast = api, city typeahead = geocoding-api) and a
# wildcard is deliberately NOT used for them; photon.komoot.io is the
# Trip Planner hotel picker; the-trivia-api.com, query.wikidata.org and
# en.wikipedia.org are Arena question/location data; *.google-analytics.com
# (not just www) is required because GA4 beacons go to
# region1.google-analytics.com.
# Leaflet is NOT listed: it was self-hosted under apps/trip-planner/
# vendor/leaflet/ on 2026-07-20 and now loads from 'self'.
# fantasy.premierleague.com is NOT listed either: the FPL Planner reads it
# only through /.netlify/functions/fpl, and its direct-upstream fallback
# (apps/fpl-planner/js/data/api.js) is unreachable in production because
# FPL sends no CORS headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://cdnjs.cloudflare.com https://www.googletagmanager.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' data: https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebasedatabase.app https://*.firebaseapp.com https://*.google-analytics.com https://*.analytics.google.com https://us-central1-jjexperiment-12af6.cloudfunctions.net https://maptap.gg https://nominatim.openstreetmap.org https://photon.komoot.io https://archive-api.open-meteo.com https://api.open-meteo.com https://geocoding-api.open-meteo.com https://api.frankfurter.dev https://api.openai.com https://raw.githubusercontent.com https://the-trivia-api.com https://query.wikidata.org https://en.wikipedia.org wss://*.firebaseio.com; frame-src 'self' https://shevato-site.firebaseapp.com https://apis.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /.netlify/functions/csp-report"

# Gym Tracker is a service-worker PWA: its worker precaches the shell and
# serves everything stale-while-revalidate out of CacheStorage, so the SW is
# the performance layer and the HTTP layer only has to be correct.
#
# These files must NOT carry a positive max-age. Chrome serves a fresh-enough
# subresource straight from its memory cache WITHOUT firing the worker's
# fetch event, so a max-age window hides the request from the worker: its
# cached copy is never revalidated and the page keeps running the old module
# against new HTML for the whole window (2026-08-22 audit D5, reproduced in
# apps/gym-tracker/e2e/audit-2026-08.mjs against a proxy that serves exactly
# these headers). With max-age=0 the worker sees every request, revalidates
# with `cache: 'no-cache'`, and the load after a deploy is coherent.
[[headers]]
  for = "/apps/gym-tracker/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/apps/gym-tracker/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/apps/gym-tracker/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Netlify serves .webmanifest as application/octet-stream by default;
# browsers tolerate it but the registered type is the one below.
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
# Quote Scout fixtures are test-only and must never be served as production data.
# Force is intentional: these source files exist in the root publish directory.
[[redirects]]
  from = "/apps/quotescout/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/apps/quotescout/e2e/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/functions/tests/*"
  to = "/404.html"
  status = 404
  force = true
